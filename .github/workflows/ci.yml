name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # CLAUDE.md §2.1 — 파이프라인 전용 키가 앱 코드로 새지 않았는지
      - name: 시크릿 유출 검사
        run: pnpm check:secrets

  # main 에 머지된 마이그레이션이 클라우드에 적용됐는지 본다.
  #
  # 왜: 마이그레이션 파일을 커밋하고 `supabase db push` 를 빠뜨려 프로덕션
  # 파이프라인이 죽는 사고가 두 번 났다 (2026-09-06, D-49). 코드는 배포되고
  # 스키마는 안 가는 상태를 사람이 기억으로 막을 수 없다.
  #
  # **실패시키지 않고 경고만 한다.** 배포 순서상 머지 직후 잠깐 어긋나는 것은
  # 정상이고, 여기서 빨간불을 내면 곧 무시하게 된다. 목적은 눈에 띄게 하는 것이다.
  migrations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # step 의 `if` 는 그 step 의 `env` 보다 먼저 평가된다. job 레벨에 둬야 스킵이 먹는다
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 로컬과 클라우드의 마이그레이션 차이
        # 토큰이 없으면 조용히 건너뛴다 — 시크릿을 등록하기 전에도 CI 는 돌아야 한다
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          npx --yes supabase@latest link --project-ref ajdtgfnnvcfuasvhzbpp
          OUT=$(npx --yes supabase@latest migration list --linked)
          echo "$OUT"
          # Local 열에만 값이 있고 Remote 가 빈 줄 = 아직 push 되지 않은 마이그레이션
          PENDING=$(echo "$OUT" | awk -F'|' 'NF>2 && $2 ~ /[0-9]/ && $3 !~ /[0-9]/ {print $2}' | tr -d ' ')
          if [ -n "$PENDING" ]; then
            echo "::warning title=마이그레이션 미적용::클라우드에 없는 마이그레이션: $PENDING — 'npx supabase db push' 를 실행하세요"
          else
            echo "클라우드 스키마가 최신입니다"
          fi
